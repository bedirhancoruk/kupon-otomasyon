name: Oran Otomasyonu

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Oranlari Guncelle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python update_odds.py
