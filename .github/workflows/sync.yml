name: Oran Otomasyonu

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_odds.py
